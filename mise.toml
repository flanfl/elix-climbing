# Toolchain pinned per project (like <java.version> in a pom.xml, or a .sdkmanrc).
# `mise install` in this directory fetches exactly these versions.
[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29" # the "-otp-29" suffix = compiled against this Erlang major
node = "24"              # active LTS line
